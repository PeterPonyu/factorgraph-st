[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorgraph-st"
version = "0.0.0.dev0"
description = "Graph-factor learning of spatial domains and gene programs in spatial transcriptomics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PeterPonyu", email = "fuzeyu09@gmail.com" }]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
# Real multi-section assembly helpers in scripts/data/fetch_datasets.py
# (build_section_inputs / build_spatial_graph). Not required for the core
# install or the network-free CLI tests (see issue #52).
data = ["scanpy>=1.10", "squidpy>=1.6", "anndata>=0.10", "scipy>=1.11"]

[project.urls]
Homepage = "https://github.com/PeterPonyu/factorgraph-st"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorgraph-st"
version = "0.0.0.dev0"
description = "Graph-factor learning of spatial domains and gene programs in spatial transcriptomics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PeterPonyu", email = "fuzeyu09@gmail.com" }]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
# scipy is a test-only oracle: it cross-checks the numpy-only NNLS solver in
# decoder.py against scipy.optimize.nnls. The runtime package stays numpy-only,
# so the stale scipy<2 cap is gone — the test extra tracks current scipy.
test = ["pytest>=8,<9", "scipy>=1.10", "tomli>=2.0; python_version < '3.11'"]
dev = ["ruff>=0.5", "mypy>=1.8"]
# real-data: heavyweight deps used ONLY by the scripts/run_real_factorgraph.py
# and scripts/compute_further_factorgraph_metrics.py real-data results path
# (scanpy/anndata h5ad loading, scipy kNN). The runtime package itself stays
# numpy-only; these are opt-in via `pip install -e '.[real-data]'`.
real-data = ["scipy>=1.10", "scanpy>=1.10", "anndata>=0.10"]
# Real multi-section assembly helpers in scripts/data/fetch_datasets.py
# (build_section_inputs / build_spatial_graph). Not required for the core
# install or the network-free CLI tests (see issue #52).
data = ["scanpy>=1.10", "squidpy>=1.6", "anndata>=0.10", "scipy>=1.11"]

[project.urls]
Homepage = "https://github.com/PeterPonyu/factorgraph-st"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ is on sys.path for collection so `pytest` works out-of-the-box without
# requiring `PYTHONPATH=src` or an editable install (see issue #289).
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, UP: pyupgrade, B: bugbear.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# results_contract.py is vendored BYTE-IDENTICALLY from the parent orchestration
# repo (scripts/contract/results_contract.py) and is kept in sync via
# `make sync-contract`, with byte-identity enforced by
# tests/test_contract_schema.py. It is authored under the parent's default ruff
# profile (E/F only), so it predates the UP pyupgrade rules this repo selects
# (e.g. UP035 collections.abc, UP045 `X | None`). It cannot be modified here
# without breaking the SHA-256 lock, so its pyupgrade findings are ignored.
"src/factorgraph_st/results_contract.py" = ["UP"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true

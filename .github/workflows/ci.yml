name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  independence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brand / leakage scan
        run: bash scripts/check_independence.sh

      - name: Brand metadata check
        run: bash scripts/check_brand_metadata.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # Pin the exact ruff that last ran main green (#395 follow-up): keeps lint
          # reproducible so a future ruff release with new default rules cannot redden
          # main unprovoked. Bump deliberately alongside the pyproject <0.16 cap.
          python -m pip install "ruff==0.15.16"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy type-check
        run: mypy

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package if pyproject.toml exists
        run: |
          if [ -f pyproject.toml ]; then
            python -m pip install --upgrade pip
            python -m pip install -e ".[test]"
          else
            echo "No pyproject.toml; skipping package install."
          fi

      - name: Run pytest if test files exist
        run: |
          if find tests -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m pytest -q
          else
            echo "No test_*.py files yet; skipping pytest."
          fi

# Dataset provenance card — schema mirrors scripts/data/fetch_datasets.py:Dataset
id: merfish_hypothalamus_shared
title: MERFISH mouse hypothalamus (Moffitt 2018; 8 AP sections)
tier: B
platform: MERFISH (imaging)
tissue: mouse hypothalamic preoptic region
disease: none (healthy reference)
sections: 8            # anterior-posterior levels via obs['Bregma']
cells: 73655
genes: 161
labels: obs['Cell_class']
citation_key: moffitt2018
issues: [45]
accession:

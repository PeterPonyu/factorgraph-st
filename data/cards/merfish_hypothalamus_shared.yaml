approx_bytes: null      # squidpy-cached object
license: CC0 (Dryad raw counts)
raw_count_policy: >-
  The squidpy copy is NORMALIZED. For DL training pull raw integer counts from
  Dryad doi:10.5061/dryad.8t8s248 (UNVERIFIED direct URL) and assert int at load.
contract:
  X: (n_cells, n_genes) float32 raw counts (Dryad source for raw)
  coords: (n_cells, 2) float32 cell centroids; 3D in obsm['spatial3d']
  section_id: int per AP level (obs['Bregma'], 8 levels)
  edges: (2, n_edges) int64 generic kNN via build_spatial_graph(coord_type='generic')
notes: >-
  Heterogeneous, non-Visium stress test for the section-aware encoder. Shared
